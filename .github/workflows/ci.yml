# Pull requests: run the checks, deploy a Workers Preview, and pin its URL to the PR.
# Closing the PR deletes the Preview.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}-${{ github.event.action == 'closed' }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/checks.yml
    with:
      sha: ${{ github.event.pull_request.head.sha }}
      preview_name: pr-${{ github.event.pull_request.number }}
    secrets: inherit

  preview:
    # Same-repo, human-authored PRs only: forks and Dependabot don't get the Cloudflare secrets.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - id: preview
        name: Create or update Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          output="$(npx wrangler preview --name "pr-${PR_NUMBER}" --message "${HEAD_SHA}" --json)"
          printf '%s\n' "$output"
          # wrangler prints upload progress before the JSON document; start at its opening brace.
          url="$(printf '%s\n' "$output" | sed -n '/^{$/,$p' | jq -er '[(.preview.urls // empty), (.. | objects | .urls? // empty)] | flatten | .[0]')"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
      - name: Comment Preview URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$(printf '**Preview:** %s\n\nBuilt from %s.' "$URL" "${HEAD_SHA:0:7}")"

  lighthouse:
    # Mobile Lighthouse against the live Preview. Blocking: if the gate fails
    # (performance < 95, or accessibility/best-practices/SEO < 100), this job fails and blocks the PR.
    needs: preview
    runs-on: ubuntu-latest
    env:
      URL: ${{ needs.preview.outputs.url }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Warm the Preview (edge cache)
        run: |
          for i in 1 2; do curl -s -o /dev/null "$URL/"; done
          curl -s "$URL/" | grep -oE '/(css|js|fonts)/[^"]+' | sort -u | while read -r asset; do curl -s -o /dev/null "$URL$asset"; done
      - name: Run Lighthouse (mobile, 3 runs)
        run: |
          # Previews are served with <meta name="robots" content="noindex"> on purpose, so the
          # is-crawlable audit is skipped here; production is checked without that exemption.
          for i in 1 2 3; do
            npx --yes lighthouse@13 "$URL" --form-factor=mobile \
              --only-categories=performance,accessibility,best-practices,seo \
              --skip-audits=is-crawlable \
              --output=json --output-path="./lighthouse-$i.json" --quiet \
              --chrome-flags="--headless=new --no-sandbox"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: lighthouse-pr-${{ github.event.pull_request.number }}
          path: lighthouse-*.json
          retention-days: 7
      - name: Report median scores
        run: |
          node -e '
            const fs = require("fs");
            const runs = [1, 2, 3].map((i) => JSON.parse(fs.readFileSync(`./lighthouse-${i}.json`, "utf8")).categories);
            const median = (xs) => xs.sort((a, b) => a - b)[Math.floor(xs.length / 2)];
            const scores = Object.fromEntries(Object.keys(runs[0]).map((k) => [k, median(runs.map((r) => Math.round(r[k].score * 100)))]));
            const all = Object.fromEntries(Object.keys(runs[0]).map((k) => [k, runs.map((r) => Math.round(r[k].score * 100)).join(" / ")]));
            const rows = Object.entries(scores).map(([k, v]) => `| ${k} | **${v}** | ${all[k]} |`).join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Lighthouse (mobile, median of 3)\n\n${process.env.URL}\n\n| Category | Median | Runs |\n|---|---|---|\n${rows}\n`);
            console.table(scores); console.table(all);
            const gate = { performance: 95, accessibility: 100, "best-practices": 100, seo: 100 };
            const failing = Object.entries(gate).filter(([k, min]) => scores[k] < min);
            if (failing.length) { console.error("below gate:", failing.map(([k, min]) => `${k} ${scores[k]} < ${min}`).join(", ")); process.exit(1); }
          '

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Delete Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npx wrangler preview delete --name "pr-${PR_NUMBER}" --skip-confirmation
