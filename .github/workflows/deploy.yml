# main: run the checks, then deploy the built artifact to production and smoke-test it.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      sha: ${{ github.sha }}
      release: true

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://resume.austinhenry.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke test
        run: |
          curl -sfI https://resume.austinhenry.dev/ > /dev/null
          curl -sf https://resume.austinhenry.dev/ | grep -q '<title>'
